<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>TikTok Location</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="wrap">
    <h1>TikTok Location</h1>
    <p class="intro">Syötä TikTok-käyttäjänimi.</p>

    <div class="search">
      <span>@</span>
      <input id="username" type="text" placeholder="käyttäjänimi" autocomplete="off" />
      <button id="analyzeBtn">Hae</button>
    </div>

    <section id="result" class="result hidden" aria-live="polite">
      <div class="label">Arvioitu sijainti</div>
      <div id="location" class="location">Ei tietoa</div>
      <div id="confidence" class="confidence"></div>
      <div id="reason" class="reason"></div>
    </section>

    <details>
      <summary>Lisää julkisia vihjeitä käsin</summary>
      <textarea id="bio" rows="4" placeholder="Bio, hashtagit tai muu julkinen teksti"></textarea>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
